<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpiceGarden Calls</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%239d1c20'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="calls.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">SG</span>
        <span><span class="brand-name">SpiceGarden</span><span class="brand-sub" style="display:block">Calls to your voice agent</span></span>
      </a>
      <nav class="top-nav" aria-label="Dashboard pages">
        <a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2zM8 8a4 4 0 0 1 8 0"/></svg>Orders</a>
        <a href="/tables"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M6 10v9M18 10v9M8 6h8"/></svg>Tables</a>
        <a href="/calls" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Calls</a>
      </nav>
      <div class="top-right">
        <span class="today-label" id="today-label"></span>
        <span class="live" id="live" role="status"><span class="dot" aria-hidden="true"></span><span id="live-text">Connecting…</span></span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch light or dark mode" title="Light or dark mode">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="calls-head">
      <div>
        <h1 class="page-title">Call Logs</h1>
        <p class="page-sub">Every call your voice agent finished, with its summary and what came of it.</p>
        <div class="chips" id="call-chips" aria-label="Filter calls" style="margin-top:18px">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-filter="today" aria-pressed="false">Today</button>
          <button type="button" class="chip" data-filter="order" aria-pressed="false">With an order</button>
          <button type="button" class="chip" data-filter="booking" aria-pressed="false">With a booking</button>
        </div>
      </div>
      <div class="calls-count" aria-live="polite">
        <div><p class="cc-num" id="cc-today">–</p><p class="cc-label">calls today</p></div>
        <div class="cc-lines"><p id="cc-orders">–</p><p id="cc-bookings">–</p></div>
      </div>
    </div>

    <div class="calls-body">
      <section class="timeline" id="timeline" aria-busy="true"></section>
      <aside class="call-panel" id="call-panel" hidden aria-label="Call details"></aside>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Dashboard pages">
    <a href="/"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.5 11a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2zM8 8a4 4 0 0 1 8 0"/></svg></span>Orders</a>
    <a href="/tables"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M6 10v9M18 10v9M8 6h8"/></svg></span>Tables</a>
    <a href="/calls" aria-current="page"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>Calls</a>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="common.js"></script>
  <script src="calls.js"></script>
</body>
</html>
