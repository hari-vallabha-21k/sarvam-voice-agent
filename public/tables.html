<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpiceGarden Tables</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23c2410c'/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tables.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>SpiceGarden</h1>
        <p class="sub">Table bookings from the Sarvam voice agent and the front desk</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="live" id="live"><span class="dot" aria-hidden="true"></span><span id="live-text">Connecting…</span></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <main class="tables-main">
    <div class="toolbar">
      <nav class="page-nav" aria-label="Dashboard pages">
        <a href="/">Orders</a>
        <a href="/tables" aria-current="page">Tables</a>
      </nav>
      <label class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search table, guest or phone…" aria-label="Search tables and guests" autocomplete="off" />
        <kbd aria-hidden="true">/</kbd>
      </label>
      <select id="status-filter" class="select" aria-label="Filter by status">
        <option value="">All Statuses</option>
        <option value="available">Available</option>
        <option value="reserved">Reserved</option>
        <option value="occupied">Occupied</option>
      </select>
      <select id="area-filter" class="select" aria-label="Filter by area">
        <option value="">All Areas</option>
      </select>
    </div>

    <div class="viewbar">
      <div class="when">
        <label class="field-inline">
          <span>Date</span>
          <input type="date" id="view-date" class="date-input" />
        </label>
        <label class="field-inline">
          <span>Time</span>
          <select id="view-time" class="select select-sm"></select>
        </label>
        <button type="button" class="link-btn" id="view-now">Now</button>
      </div>
      <ul class="legend" aria-label="Table summary">
        <li><span class="legend-dot available" aria-hidden="true"></span>Available <strong id="sum-available">–</strong></li>
        <li><span class="legend-dot reserved" aria-hidden="true"></span>Reserved <strong id="sum-reserved">–</strong></li>
        <li><span class="legend-dot occupied" aria-hidden="true"></span>Occupied <strong id="sum-occupied">–</strong></li>
      </ul>
      <button type="button" class="btn btn-lg accent" id="new-booking">+ New booking</button>
    </div>

    <section class="waiting" id="waiting" hidden aria-labelledby="waiting-title">
      <h2 id="waiting-title">Waiting for a table</h2>
      <ul id="waiting-list"></ul>
    </section>

    <section class="table-grid" id="grid" aria-label="Tables" aria-live="polite"></section>
    <p class="empty" id="grid-empty" hidden>No tables match these filters.</p>
  </main>

  <div class="drawer-backdrop" id="backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <header class="drawer-head">
      <div class="drawer-title-wrap" id="drawer-head"></div>
      <button type="button" class="icon-btn" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="drawer-body">
      <div id="drawer-current"></div>
      <section id="drawer-day"></section>
      <form class="book-form" id="book-form" novalidate>
        <h3 id="form-title">Book this table</h3>
        <div class="form-grid">
          <label class="field span-2">Guest name <input name="customer_name" required autocomplete="off" /></label>
          <label class="field span-2">Phone <input name="customer_phone" type="tel" inputmode="tel" placeholder="+91" autocomplete="off" /></label>
          <label class="field">Date <input name="booking_date" type="date" required /></label>
          <label class="field">Time <select name="booking_time" required></select></label>
          <label class="field">Guests <input name="party_size" type="number" min="1" max="8" value="2" required /></label>
          <label class="field" id="table-field">Table <select name="table_id"></select></label>
          <label class="field span-2">Notes <input name="notes" placeholder="Birthday, high chair, window seat…" autocomplete="off" /></label>
        </div>
        <p class="form-msg" id="form-msg" role="status"></p>
        <button type="submit" class="btn btn-lg accent" id="form-submit">Confirm booking</button>
      </form>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="tables.js"></script>
</body>
</html>
